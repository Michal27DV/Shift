<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Disco gradient — pink-300 → violet-400 → violet-500 (stejný jako .cal-title v disco režimu) -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Černé pozadí (zaoblený čtverec, iOS-style) -->
  <rect width="512" height="512" rx="112" fill="#000"/>
  <!-- Hodiny — circle + 2 ručičky -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#g)" stroke-width="28"/>
  <g fill="url(#g)">
    <rect x="244" y="150" width="24" height="110" rx="12"/>
    <rect x="248" y="244" width="96" height="24" rx="12" transform="rotate(30 256 256)"/>
  </g>
</svg>
