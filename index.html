function ShiftForm({ mode, shift, defaultRate, onClose, onSave, onDelete }) {
    const isUpcoming = mode === 'upcoming' || (mode === 'edit' && shift?.status === 'upcoming');

    const [date, setDate] = useState(shift ? shift.date.split('T')[0] : todayStr());
    const [startTime, setStartTime] = useState(shift ? getTimeStr(shift.startTime) : defaultTime(9));
    const [endTime, setEndTime] = useState(shift ? getTimeStr(shift.endTime) : defaultTime(17));
    const [duration, setDuration] = useState(
        shift ? hoursBetween(shift.startTime, shift.endTime).toFixed(1) : '6'
    );
    const [wage, setWage] = useState(shift ? shift.hourlyWage : (defaultRate || 150));
    const [error, setError] = useState('');
    const [confirmDelete, setConfirmDelete] = useState(false);

    const calc = useMemo(() => {
        if (isUpcoming) {
            const hrs = parseFloat(duration) || 0;
            return { hours: hrs, earnings: hrs * (parseFloat(wage) || 0) };
        }
        const startIso = combineDateAndTime(date, startTime);
        const endIso = combineDateAndTime(date, endTime);
        const hrs = hoursBetween(startIso, endIso);
        return { hours: hrs, earnings: hrs * (parseFloat(wage) || 0) };
    }, [date, startTime, endTime, duration, wage, isUpcoming]);

    const handleSave = () => {
        setError('');
        const w = parseFloat(wage);
        if (isNaN(w) || w < 0) return setError('Hodinová sazba musí být nezáporné číslo.');

        if (isUpcoming) {
            const dur = parseFloat(duration);
            if (isNaN(dur) || dur <= 0) return setError('Délka musí být větší než 0.');
            const startIso = combineDateAndTime(date, startTime);
            const endIso = new Date(new Date(startIso).getTime() + dur * 3600000).toISOString();
            onSave({ date: new Date(date).toISOString(), startTime: startIso, endTime: endIso, hourlyWage: w });
        } else {
            const startIso = combineDateAndTime(date, startTime);
            const endIso = combineDateAndTime(date, endTime);
            if (new Date(endIso) <= new Date(startIso)) return setError('Konec musí být později než začátek.');
            onSave({ date: new Date(date).toISOString(), startTime: startIso, endTime: endIso, hourlyWage: w });
        }
    };

    const title = mode === 'upcoming' ? 'Plánovaná směna'
                : mode === 'past' ? 'Minulá směna'
                : (shift?.needsReview ? 'Zkontrolovat směnu' : 'Upravit směnu');

    return (
        <div className="overlay" onClick={onClose}>
            <div className="sheet" onClick={e => e.stopPropagation()}>
                <div className="sheet-header">
                    <button className="sheet-btn" onClick={onClose}>Zrušit</button>
                    <div className="sheet-title">{title}</div>
                    <button className="sheet-btn primary" onClick={handleSave}>Uložit</button>
                </div>
                <div className="sheet-body">
                    {mode === 'edit' && shift?.needsReview && (
                        <div className="review-banner">
                            <Icon name="alert" size={16} />
                            <span>Tahle plánovaná směna skončila — potvrď skutečné hodiny.</span>
                        </div>
                    )}
                    {error && <div className="error-box">{error}</div>}

                    <div className="form-section">
                        <div className="form-section-title">Kdy</div>
                        <div className="form-group">
                            <div className="form-row">
                                <div className="form-label">Datum</div>
                                <input className="form-input" type="date" value={date}
                                       onChange={e => setDate(e.target.value)} />
                            </div>
                            <div className="form-row">
                                <div className="form-label">Začátek</div>
                                <input className="form-input" type="time" value={startTime}
                                       onChange={e => setStartTime(e.target.value)} />
                            </div>
                            {!isUpcoming && (
                                <div className="form-row">
                                    <div className="form-label">Konec</div>
                                    <input className="form-input" type="time" value={endTime}
                                           onChange={e => setEndTime(e.target.value)} />
                                </div>
                            )}
                        </div>
                    </div>

                    {isUpcoming && (
                        <div className="form-section">
                            <div className="form-section-title">Odhad</div>
                            <div className="form-group">
                                <div className="form-row">
                                    <div className="form-label">Délka (h)</div>
                                    <input className="form-input" type="number" step="0.5" min="0"
                                           value={duration} onChange={e => setDuration(e.target.value)} />
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="form-section">
                        <div className="form-section-title">Odměna</div>
                        <div className="form-group">
                            <div className="form-row">
                                <div className="form-label">Sazba (Kč/h)</div>
                                <input className="form-input" type="number" step="10" min="0"
                                       value={wage} onChange={e => setWage(e.target.value)} />
                            </div>
                        </div>
                    </div>

                    <div className="form-section">
                        <div className="form-section-title">{isUpcoming ? 'Očekáváno' : 'Souhrn'}</div>
                        <div className="form-group">
                            <div className="form-row">
                                <div className="form-label">Hodiny</div>
                                <div style={{fontVariantNumeric: 'tabular-nums'}}>{fmtHours(calc.hours)}</div>
                            </div>
                            <div className="form-row">
                                <div className="form-label">Výdělek</div>
                                <div style={{fontVariantNumeric: 'tabular-nums', fontWeight: 700, color: 'var(--accent)'}}>
                                    {isUpcoming && '≈ '}{fmtCZK(calc.earnings)}
                                </div>
                            </div>
                        </div>
                    </div>

                    {mode === 'edit' && (
                        <button className="delete-btn" onClick={() => setConfirmDelete(true)}>Smazat směnu</button>
                    )}
                </div>
            </div>
            {confirmDelete && (
                <div className="overlay center" onClick={e => { e.stopPropagation(); setConfirmDelete(false); }}>
                    <div className="alert" onClick={e => e.stopPropagation()}>
                        <h3>Smazat směnu?</h3>
                        <p>Tuto akci nelze vzít zpět.</p>
                        <div className="alert-buttons">
                            <button onClick={() => setConfirmDelete(false)}>Zrušit</button>
                            <button className="destructive" onClick={onDelete}>Smazat</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

/* ============================================
   EARNINGS SCREEN
   ============================================ */
// Pomocná: vyber rok+měsíc směny podle data startu (lokální čas)
function shiftYearMonth(sh) {
    const d = new Date(sh.startTime || sh.date);
    return { year: d.getFullYear(), month: d.getMonth() };
}

// Spočítá souhrn z libovolného setu směn
function summarize(shifts) {
    const completed = shifts.filter(s => s.status === 'completed');
    const upcoming = shifts.filter(s => s.status === 'upcoming');
    const earned = completed.reduce((s, x) => s + hoursBetween(x.startTime, x.endTime) * x.hourlyWage, 0);
    const earnedHours = completed.reduce((s, x) => s + hoursBetween(x.startTime, x.endTime), 0);
    const expected = upcoming.reduce((s, x) => s + hoursBetween(x.startTime, x.endTime) * x.hourlyWage, 0);
    const expectedHours = upcoming.reduce((s, x) => s + hoursBetween(x.startTime, x.endTime), 0);
    return {
        earned, earnedHours, expected, expectedHours,
        completedCount: completed.length, upcomingCount: upcoming.length,
        combined: earned + expected
    };
}

function shiftCountLabel(n) {
    if (n === 1) return 'směna';
    if (n < 5) return 'směny';
    return 'směn';
}

function EarningsScreen({ shifts }) {
    // Měsíční kurzor — defaultně aktuální měsíc
    const [cursor, setCursor] = useState(() => {
        const t = new Date();
        return { year: t.getFullYear(), month: t.getMonth() };
    });
    const [showAllTime, setShowAllTime] = useState(false);

    // Filtrované směny pro vybraný měsíc
    const monthShifts = useMemo(() => shifts.filter(sh => {
        const ym = shiftYearMonth(sh);
        return ym.year === cursor.year && ym.month === cursor.month;
    }), [shifts, cursor]);

    const monthSummary = useMemo(() => summarize(monthShifts), [monthShifts]);
    const allSummary = useMemo(() => summarize(shifts), [shifts]);

    const goPrev = () => setCursor(c => {
        const m = c.month - 1;
        return m < 0 ? { year: c.year - 1, month: 11 } : { year: c.year, month: m };
    });
    const goNext = () => setCursor(c => {
        const m = c.month + 1;
        return m > 11 ? { year: c.year + 1, month: 0 } : { year: c.year, month: m };
    });

    // Můžeme jít dál? (zakážeme jen úplnou budoucnost — nech max +1 rok pro plánování)
    const monthLabel = `${MONTH_NAMES[cursor.month]} ${cursor.year}`;
    const isCurrentMonth = (() => {
        const t = new Date();
        return t.getFullYear() === cursor.year && t.getMonth() === cursor.month;
    })();

    return (
        <>
            <header className="nav-bar">
                <div className="nav-title">Výdělek</div>
            </header>
            <main className="scroll">
                {/* Měsíční přepínač */}
                <div className="month-switcher">
                    <button className="cal-nav" onClick={goPrev} aria-label="Předchozí měsíc">
                        <Icon name="chevronLeft" size={20} />
                    </button>
                    <div className="month-switcher-label">
                        <span className="month-switcher-name">{monthLabel}</span>
                        {isCurrentMonth && <span className="month-switcher-badge">tento měsíc</span>}
                    </div>
                    <button className="cal-nav" onClick={goNext} aria-label="Další měsíc">
                        <Icon name="chevronRight" size={20} />
                    </button>
                </div>

                {monthShifts.length === 0 ? (
                    <div className="empty" style={{padding: '40px 20px'}}>
                        <div className="empty-icon"><Icon name="wage" size={36} /></div>
                        <h2>Žádné směny</h2>
                        <p>V {monthLabel.toLowerCase()} žádné směny nemáš.</p>
                    </div>
                ) : (
                    <>
                        <div className="glass earnings-hero">
                            <div className="earnings-label">
                                <Icon name="check" size={16} />
                                Vyděláno za měsíc
                            </div>
                            <div className="earnings-big tone-earned">{fmtCZK(monthSummary.earned)}</div>
                            <div className="earnings-sub">
                                {monthSummary.completedCount} {shiftCountLabel(monthSummary.completedCount)} · {fmtHours(monthSummary.earnedHours)}
                            </div>
                        </div>

                        {monthSummary.upcomingCount > 0 && (
                            <div className="glass earnings-hero">
                                <div className="earnings-label">
                                    <Icon name="calendar" size={16} />
                                    Očekáváno za měsíc
                                </div>
                                <div className="earnings-big earnings-small tone-expected">≈ {fmtCZK(monthSummary.expected)}</div>
                                <div className="earnings-sub">
                                    {monthSummary.upcomingCount} {monthSummary.upcomingCount === 1 ? 'plánovaná' : 'plánované'} · ~{fmtHours(monthSummary.expectedHours)}
                                </div>
                            </div>
                        )}

                        {monthSummary.upcomingCount > 0 && monthSummary.completedCount > 0 && (
                            <div className="earnings-combined">
                                <div className="earnings-label" style={{marginBottom: 10}}>Měsíční výhled</div>
                                <div className="earnings-big tone-combined">{fmtCZK(monthSummary.combined)}</div>
                                <div className="earnings-sub">Vyděláno + očekáváno</div>
                            </div>
                        )}
                    </>
                )}

                {/* Celkem za celou dobu — rozbalovací */}
                {shifts.length > 0 && (
                    <button className={'all-time-toggle' + (showAllTime ? ' open' : '')}
                            onClick={() => setShowAllTime(v => !v)}>
                        <span className="all-time-toggle-icon">
                            <Icon name={showAllTime ? 'chevronLeft' : 'chevronRight'} size={16} />
                        </span>
                        <span className="all-time-toggle-label">
                            <span className="all-time-toggle-title">Celkem za celou dobu</span>
                            <span className="all-time-toggle-sub">
                                {showAllTime ? 'Klepni pro skrytí' : 'Souhrn všech směn'}
                            </span>
                        </span>
                        <span className="all-time-toggle-value tone-lifetime">{fmtCZK(allSummary.earned)}</span>
                    </button>
                )}

                {showAllTime && shifts.length > 0 && (
                    <div className="all-time-panel">
                        <div className="glass earnings-hero">
                            <div className="earnings-label">
                                <Icon name="check" size={16} />
                                Celkem vyděláno
                            </div>
                            <div className="earnings-big tone-lifetime">{fmtCZK(allSummary.earned)}</div>
                            <div className="earnings-sub">
                                {allSummary.completedCount} {shiftCountLabel(allSummary.completedCount)} · {fmtHours(allSummary.earnedHours)}
                            </div>
                        </div>

                        {allSummary.upcomingCount > 0 && (
                            <div className="glass earnings-hero">
                                <div className="earnings-label">
                                    <Icon name="calendar" size={16} />
                                    Očekáváno celkem
                                </div>
                                <div className="earnings-big earnings-small tone-expected">≈ {fmtCZK(allSummary.expected)}</div>
                                <div className="earnings-sub">
                                    {allSummary.upcomingCount} plánované · ~{fmtHours(allSummary.expectedHours)}
                                </div>
                            </div>
                        )}

                        <div className="earnings-combined">
                            <div className="earnings-label" style={{marginBottom: 10}}>Celkový výhled</div>
                            <div className="earnings-big tone-combined">{fmtCZK(allSummary.combined)}</div>
                            <div className="earnings-sub">Vyděláno + plánované</div>
                        </div>
                    </div>
                )}
            </main>
        </>
    );
}

/* ============================================
   SETTINGS SCREEN
   ============================================ */
function SettingsScreen({ settings, actions, user }) {
    const [signingOut, setSigningOut] = useState(false);
    const initial = (user?.email || '?').charAt(0).toUpperCase();

    const handleSignOut = async () => {
        setSigningOut(true);
        try { await auth.signOut(); }
        catch (e) { console.error(e); setSigningOut(false); }
    };

    return (
        <>
            <header className="nav-bar">
                <div className="nav-title">Nastavení</div>
            </header>
            <main className="scroll">
                <div className="section-title">Účet</div>
                <div className="glass settings-group">
                    <div className="account-row">
                        <div className="account-avatar">{initial}</div>
                        <div className="account-meta">
                            <div className="account-email">{user?.email || '—'}</div>
                            <div className="account-status">
                                <span className="sync-dot" /> Synchronizováno přes Firebase
                            </div>
                        </div>
                    </div>
                </div>

                <div className="section-title">Brigáda</div>
                <div className="glass settings-group">
                    <div className="settings-row">
                        <div className="settings-icon"><Icon name="wage" size={18} /></div>
                        <div className="settings-label">Výchozí sazba</div>
                        <input className="settings-input" type="number" min="0" step="10"
                               value={settings.hourlyRate}
                               onChange={e => actions.setSetting('hourlyRate', parseFloat(e.target.value) || 0)} />
                        <span style={{color: 'var(--text-secondary)', fontSize: '13px'}}>Kč/h</span>
                    </div>
                </div>

                <div className="section-title">Vzhled</div>
                <div className="glass settings-group">
                    <div className="settings-row" style={{flexDirection: 'column', alignItems: 'stretch', gap: '12px'}}>
                        <div style={{display: 'flex', alignItems: 'center', gap: '14px'}}>
                            <div className="settings-icon"><Icon name="moon" size={18} /></div>
                            <div className="settings-label">Téma</div>
                        </div>
                        <div className="theme-select">
                            {['light', 'auto', 'dark', 'disco'].map(t => (
                                <button key={t}
                                        className={'theme-option' + ((settings.theme === t || (t === 'disco' && settings.theme === 'clean')) ? ' active' : '')}
                                        onClick={() => actions.setSetting('theme', t)}>
                                    {t === 'light' ? 'Světlý'
                                     : t === 'dark' ? 'Tmavý'
                                     : t === 'disco' ? 'Disco'
                                     : 'Auto'}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>

                <div className="section-title">O aplikaci</div>
                <div className="glass settings-group">
                    <div className="settings-row">
                        <div className="settings-icon"><Icon name="info" size={18} /></div>
                        <div className="settings-label">Verze</div>
                        <div className="settings-value">3.0</div>
                    </div>
                    <div className="settings-row">
                        <div className="settings-label" style={{marginLeft: 48}}>Úložiště</div>
                        <div className="settings-value">Firebase + lokální cache</div>
                    </div>
                </div>

                <button className="delete-btn" style={{marginTop: 8}}
                        onClick={handleSignOut} disabled={signingOut}>
                    {signingOut ? 'Odhlašování…' : 'Odhlásit se'}
                </button>
            </main>
        </>
    );
}
